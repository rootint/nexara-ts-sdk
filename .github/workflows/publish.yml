name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/nexara-sdk
    permissions:
      contents: read
      # Trusted publishing: npm authenticates this workflow via OIDC, so no
      # token is stored anywhere. Also lets npm attach a provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      # setup-node ships an older npm; OIDC trusted publishing needs >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest
      - name: Install
        run: npm ci
      - name: Check
        run: |
          npm run typecheck
          npm test
      # npm publish reruns typecheck+test (prepublishOnly) and rebuilds dist
      # from source (prepack), so the tarball can never be stale.
      - name: Publish
        run: npm publish --provenance --access public
